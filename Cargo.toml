[package]
name = "stream-live-translate"
version = "0.0.17"
edition = "2021"
rust-version = "1.74"
authors = ["Stream Live Translate Contributors"]
description = "Real-time AI subtitle overlay for OBS Studio. Capture system audio, stream it to a realtime translation model, and render Chinese subtitles in a Browser Source."
license = "MIT"
repository = "https://github.com/yourname/stream-live-translate"
readme = "README.md"
keywords = ["obs", "subtitles", "live", "translation", "ai"]
categories = ["multimedia", "network"]

[[bin]]
name = "stream-live-translate"
path = "src/main.rs"

# We want a tiny release binary that *embeds* all of the dist/ assets so
# the final distributable is ONE file. The user double-clicks it; that's it.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
incremental = false
# Compress embedded assets at build time so a single binary stays under ~10MB.
debug = 0
# MSVC builds must not depend on VCRUNTIME140.dll: the engine is spawned by
# the OBS plugin and the OBS install dir is NOT in its DLL search path, so a
# missing VC++ redistributable would make it exit silently on startup.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[profile.release-windows]
inherits = "release"
strip = "symbols"
opt-level = 3
lto = "thin"
codegen-units = 1

[dependencies]
# Runtime / async
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util"] }
tokio-tungstenite = { version = "0.23", features = ["native-tls"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# HTTP / WebSocket server (overlay + admin panel + OBS dock proxy)
axum = { version = "0.7", features = ["ws", "macros", "http1", "tokio"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "trace", "cors", "set-header"] }
http = "1.1"
http-body-util = "0.1"
bytes = "1.7"

# Audio capture (cross-platform loopback)
cpal = "0.15"

# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"

# Logging / CLI
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
thiserror = "1"

# Misc
once_cell = "1"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Embed dist/ (overlay + admin + default config.toml) into the binary
# at compile time so the final distributable is a SINGLE file. End users
# do not need to copy any folder or install any extra files.
include_dir = "0.7"

# Language detection for subtitle routing.
unicode-script = "0.5"

[features]
default = []
# Build without tray icon (e.g. headless / CI).
headless = []