name: OBS Plugin

# Builds the "copy into OBS plugins folder" plugin packages for
# Windows x64, Linux x64 and macOS Apple Silicon, and publishes them
# to the GitHub Release when a version tag is pushed.
#
# No OBS version is pinned here on purpose. scripts/package-plugin.* compile
# against the oldest supported libobs headers (30.2.3) and the C plugin
# registers its source with obs_register_source_s(info, size), so ONE package
# loads on OBS 30, 31, 32, 33 and later. The Windows import library is
# generated from the obs.dll available on the runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach rebuilt packages to (empty = build only, no publishing)"
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  win-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1

      # The packaging scripts keep a per-header-tag checkout so switching
      # OBS versions never reuses a stale header tree.
      - name: Cache OBS SDK assets
        uses: actions/cache@v4
        with:
          path: |
            build/plugin-sdk/obs-studio-30.2.3
            build/plugin-sdk/obs-full.zip
          key: obs-sdk-win-v2

      - name: Package plugin
        shell: pwsh
        run: ./scripts/package-plugin.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin-win-x64
          path: |
            release/stream-live-translate-obs-win-x64-*.zip
            release/stream-live-translate-obs-win-x64-*.zip.sha256

  linux-x64:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git pkg-config libasound2-dev libssl-dev

      - name: Cache OBS SDK assets
        uses: actions/cache@v4
        with:
          path: build/plugin-sdk/obs-studio-30.2.3
          key: obs-sdk-linux-v2

      - name: Package plugin
        run: |
          chmod +x scripts/package-plugin.sh
          bash scripts/package-plugin.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin-linux-x64
          path: |
            release/stream-live-translate-obs-linux-x64-*.tar.gz
            release/stream-live-translate-obs-linux-x64-*.tar.gz.sha256

  macos-arm64:
    # macos-14 now maps to the retired "macos-14-arm64-us-default"
    # configuration; macos-latest is the arm64 runner used by release.yml.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache OBS SDK assets
        uses: actions/cache@v4
        with:
          path: build/plugin-sdk/obs-studio-30.2.3
          key: obs-sdk-macos-v2

      - name: Package plugin
        run: |
          chmod +x scripts/package-plugin.sh
          bash scripts/package-plugin.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-plugin-macos-arm64
          path: |
            release/stream-live-translate-obs-macos-arm64-*.tar.gz
            release/stream-live-translate-obs-macos-arm64-*.tar.gz.sha256

  release:
    needs: [win-x64, linux-x64, macos-arm64]
    # Normal path: a v* tag was pushed. Manual path: rebuild all three
    # packages and attach them to an ALREADY published release, without
    # creating a new version or touching the tag.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: obs-plugin-*
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: |
            artifacts/**/*
          # Do not rewrite the notes of an existing release on a manual rebuild.
          generate_release_notes: ${{ github.event_name == 'push' }}
